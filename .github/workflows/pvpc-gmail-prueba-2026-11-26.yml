name: Prueba única de Gmail PVPC (26 de noviembre)

on:
  push:
    branches: [main]
    paths: [.github/workflows/pvpc-gmail-prueba-2026-11-26.yml]

permissions:
  contents: write

concurrency:
  group: pvpc-publicacion-${{ github.ref }}
  queue: max

jobs:
  enviar:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enviar una vez el PNG oficial del 26 de noviembre de 2026
        env:
          GMAIL_START_DATE: '2026-11-26'
          GMAIL_ONLY_DATE: '2026-11-26'
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python3 scripts/pvpc_gmail.py
