
name: Prueba de conexion ESIOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar API oficial REE
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("ESIOS_API_TOKEN")
          if not token:
              raise RuntimeError("No se encuentra el secreto")

          url = "https://api.esios.ree.es/indicators/1001"
          req = urllib.request.Request(
              url,
              headers={
                  "x-api-key": token,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  print("Conexion correcta con REE")
                  indicador = data.get("indicator", {})
                  print("Indicador:", indicador.get("name"))
                  print("ID:", indicador.get("id"))
          except urllib.error.HTTPError as e:
              print("Error HTTP:", e.code)
              raise
          PY
