name: PVPC oficial diario

on:
  workflow_dispatch:
  schedule:
    - cron: "30,45 20 * * *"
      timezone: Europe/Madrid
    - cron: "0,15,30,45 21 * * *"
      timezone: Europe/Madrid
    - cron: "0,30 22,23 * * *"
      timezone: Europe/Madrid
    - cron: "0 0 * * *"
      timezone: Europe/Madrid
    - cron: "0 4 * * *"
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  group: pvpc-publicacion-${{ github.ref }}
  queue: max

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Obtener la fecha original de la ejecución
        id: ejecucion
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          test -n "$created_at"
          echo "creada=$created_at" >> "$GITHUB_OUTPUT"

      - name: Obtener el estado actual de la rama
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Consultar y validar REE
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
          PVPC_SCHEDULE: ${{ github.event.schedule }}
          PVPC_RUN_CREATED_AT: ${{ steps.ejecucion.outputs.creada }}
        run: python3 scripts/pvpc_manana.py

      - name: Comprobar si falta publicar la infografía
        id: infografia
        run: |
          fecha=$(python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          report = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          if report["verificacion"] != "official_verified":
              raise ValueError("El JSON carece de la validación oficial")
          print(date.fromisoformat(report["fecha"]).isoformat())
          PY
          )
          png="data/infografias/precio_electricidad_pvpc_${fecha}.png"
          if git diff --quiet HEAD -- data/latest.json && test -f "$png"; then
            echo "El JSON y su infografía ya están publicados"
          else
            echo "ruta=$png" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar la infografía del JSON validado
        if: steps.infografia.outputs.ruta != ''
        env:
          PNG: ${{ steps.infografia.outputs.ruta }}
        run: |
          fonts=/usr/share/fonts/truetype/dejavu
          if ! test -f "$fonts/DejaVuSans.ttf" || ! test -f "$fonts/DejaVuSans-Bold.ttf"; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          python3 -m venv "$RUNNER_TEMP/pvpc"
          python="$RUNNER_TEMP/pvpc/bin/python"
          "$python" -m pip install --disable-pip-version-check Pillow==13.0.0
          temporary=$(mktemp "$RUNNER_TEMP/pvpc-XXXXXX.png")
          "$python" scripts/pvpc_infografia.py --input data/latest.json --fonts "$fonts" --output "$temporary"
          mkdir -p "$(dirname "$PNG")"
          mv -f -- "$temporary" "$PNG"

      - name: Publicar el JSON validado y su infografía
        if: steps.infografia.outputs.ruta != ''
        env:
          PNG: ${{ steps.infografia.outputs.ruta }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/latest.json "$PNG"
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Publicar PVPC oficial e infografía diaria"
            git push origin "HEAD:$GITHUB_REF"
          fi
