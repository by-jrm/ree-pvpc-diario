name: PVPC oficial diario

on:
  workflow_dispatch:
  schedule:
    - cron: "30,45 20 * * *"
      timezone: Europe/Madrid
    - cron: "0,15,30,45 21 * * *"
      timezone: Europe/Madrid
    - cron: "0,30 22,23 * * *"
      timezone: Europe/Madrid
    - cron: "0 0 * * *"
      timezone: Europe/Madrid
    - cron: "0 4 * * *"
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  group: pvpc-publicacion-${{ github.ref }}
  queue: max

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Obtener la fecha original de la ejecución
        id: ejecucion
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          test -n "$created_at"
          echo "creada=$created_at" >> "$GITHUB_OUTPUT"

      - name: Obtener el estado actual de la rama
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Consultar y validar REE
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
          PVPC_SCHEDULE: ${{ github.event.schedule }}
          PVPC_RUN_CREATED_AT: ${{ steps.ejecucion.outputs.creada }}
        run: python3 scripts/pvpc_manana.py

      - name: Publicar JSON validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "Actualizar PVPC oficial diario"
            git push origin "HEAD:$GITHUB_REF"
          fi
